name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for changelog generator if needed

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release-keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: >
          ./gradlew assembleRelease
          -PRELEASE_STORE_FILE=release-keystore.jks
          -PRELEASE_STORE_PASSWORD='${{ secrets.RELEASE_STORE_PASSWORD }}'
          -PRELEASE_KEY_ALIAS='${{ secrets.RELEASE_KEY_ALIAS }}'
          -PRELEASE_KEY_PASSWORD='${{ secrets.RELEASE_KEY_PASSWORD }}'
          -PCHANGELOG_GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
